version: 2

updates:
  # 1) GitHub Actions (when you have .github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "02:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"

  # 2) Node.js (when you have package.json + lockfile in /)
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule:
