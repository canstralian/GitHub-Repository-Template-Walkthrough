name: Test Semgrep Custom Rules

on:
  push:
    paths:
      - ".semgrep.yml"
      - "tests/semgrep/**"
  pull_request:
    paths:
      - ".semgrep.yml"
      - "tests/semgrep/**"
  workflow_dispatch:

jobs:
  test-semgrep-rules:
    name: Validate custom Semgrep rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep rule tests
        # `semgrep --test` validates every # ruleid: / # ok: annotation in the
        # test files against the rules in .semgrep.yml and exits non-zero on
        # any mismatch.
        run: |
          semgrep --test \
            --config .semgrep.yml \
            tests/semgrep/

      - name: Confirm no false positives on clean fixtures
        # Also run an actual scan over the test directory to make sure only the
        # intentionally-flagged lines are matched (exit 0 is success in --test
        # mode; use --error for the live scan to catch unintended matches).
        run: |
          echo "=== Semgrep rule test summary ==="
          semgrep --config .semgrep.yml \
            --json \
            tests/semgrep/ | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          findings = data.get('results', [])
          print(f'Total findings in test fixtures: {len(findings)}')
          for f in findings:
              print(f'  [{f[\"check_id\"]}] {f[\"path\"]}:{f[\"start\"][\"line\"]}')
          "
