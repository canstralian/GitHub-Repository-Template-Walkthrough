name: Pyre

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  pyre:
    name: Pyre Static Analysis
    permissions:
      actions: read
      contents: read
      security-events: write # Required for uploading SARIF results
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # Full history allows Pyre to optimize incremental checks

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Matches the 2026 standard for stability
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pyre
        uses: facebook/pyre-action@60697a7858f7cc8470d8cc494a3cf2ad6b06560d
        with:
          repo-directory: './'
          requirements-path: 'requirements.txt'
          # Use nightly if you need the latest 2026 security stubs
          use-nightly: false 

      # Optional: Upload results manually if you want a persistent artifact
      - name: Upload Pyre SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .pyre/report.sarif # Verify path in your local .pyre_configuration
