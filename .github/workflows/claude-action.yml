name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run if @claude is mentioned or if an issue is assigned to the bot
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    permissions:
      contents: write       # To create branches and push code
      pull-requests: write  # To comment on and create PRs
      issues: write         # To triage and respond to issues
      id-token: write       # Required for OIDC (Bedrock/Vertex)
      actions: read         # Allows Claude to see CI/CD logs for debugging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Give Claude full git history for context

      - name: Claude Code Action Official
        uses: anthropics/claude-code-action@v1
        with:
          # Required: Set this in your Repository Secrets
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          
          # Optional: Configure Claude's behavior
          claude_args: |
            --model claude-3-7-sonnet-20250219
            --max-turns 15
            --allowedTools "Bash(npm install),Bash(npm test),Bash(git push:*)"
          
          # Optional: Custom instructions for this specific workflow
          prompt: "Please analyze the request and follow the project guidelines in CLAUDE.md."
